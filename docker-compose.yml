version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    container_name: techflow_db
    environment:
      POSTGRES_DB: techflow
      POSTGRES_USER: techflow
      POSTGRES_PASSWORD: techflow123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    restart: unless-stopped

volumes:
  pgdata:
